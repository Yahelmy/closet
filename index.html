<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Closet Index</title>
<meta name="theme-color" content="#ECEEF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10121B" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Closet Index">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* standalone shell */
:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.login{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;
  padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.login .card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 18px;display:flex;flex-direction:column;gap:14px}
.login .brand{font-size:28px}
.login input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
.svc{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:50;
  background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);border-radius:12px;padding:12px 14px;font-size:14px;cursor:pointer}
.top .row{align-items:center}
.login .card .btn{width:100%}
.acct-who{font-size:20px;overflow-wrap:anywhere}

/* Layout: a phone app. Sticky label-style header, three views switched by a fixed bottom bar,
   garments shown as swing tags in a two-column rail, detail and editing in a bottom sheet. */
:root{
  --bg:#ECEEF3; --surface:#FFFFFF; --sunk:#E1E4EC; --ink:#171C36; --muted:#5C637D; --line:#CBD0DD;
  --accent:#2742C9; --on-accent:#FFFFFF; --accent-soft:#DDE3FB; --mark:#E8A90C;
  --good:#17754A; --good-soft:#D9F0E4; --warn:#9A5B00; --warn-soft:#FBEBCB; --bad:#B3261E;
  --fig:#D9C3B0; --fig-line:#171C36; --shade:rgba(23,28,54,.45); --studio:#ECEEF3;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10121B; --surface:#1A1D2B; --sunk:#242839; --ink:#ECEEF6; --muted:#9AA1BA; --line:#343A52;
  --accent:#8EA2FF; --on-accent:#0E1330; --accent-soft:#252C55; --mark:#F2C14E;
  --good:#6FD3A0; --good-soft:#143524; --warn:#F0B95A; --warn-soft:#3A2A0C; --bad:#FF8A80;
  --fig:#B89F8C; --fig-line:#ECEEF6; --shade:rgba(0,0,0,.6); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#10121B; --surface:#1A1D2B; --sunk:#242839; --ink:#ECEEF6; --muted:#9AA1BA; --line:#343A52;
  --accent:#8EA2FF; --on-accent:#0E1330; --accent-soft:#252C55; --mark:#F2C14E;
  --good:#6FD3A0; --good-soft:#143524; --warn:#F0B95A; --warn-soft:#3A2A0C; --bad:#FF8A80;
  --fig:#B89F8C; --fig-line:#ECEEF6; --shade:rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}

.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line);padding-block:12px}
.top .row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;max-width:720px;margin:0 auto}
.brand{font:700 22px/1 var(--display);letter-spacing:-.01em}
.brand i{font-style:normal;color:var(--accent)}
main{max-width:720px;margin:0 auto;padding-block:16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.view{display:flex;flex-direction:column;gap:16px}
.view h2{font-size:26px;font-weight:700}
.lede{color:var(--muted);margin:0;max-width:60ch}

.btn{border:1px solid var(--ink);background:transparent;border-radius:999px;padding:10px 16px;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.small{min-height:36px;padding:6px 12px;font-size:13px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar .grow{flex:1 1 140px;min-width:0}
input[type=search],input[type=text],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:64px;resize:vertical}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500;min-height:36px;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .n{font-family:var(--mono);font-size:11px;opacity:.7;margin-left:4px}

.note{border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;color:var(--muted);font-size:14px}
.note.live{border-style:solid;border-color:var(--accent);color:var(--ink);background:var(--accent-soft);display:flex;gap:10px;align-items:center;justify-content:space-between}
.trend summary{cursor:pointer;color:var(--ink)}
.trend ul{margin:10px 0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.trend p{margin:4px 0 0}
.trend a{color:var(--accent);overflow-wrap:anywhere}
.flag.wash{background:var(--ink);color:var(--bg)}
.tag.inwash img{opacity:.4}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.day h3{font-size:17px}
.strip{display:flex;gap:6px;overflow-x:auto;padding-top:4px}
.strip img{width:44px;height:58px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex:0 0 auto;background:var(--sunk)}
.rowi{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.rowi .tx{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14px}
.rowi .tx span{color:var(--muted)}
.rowi .done strong{text-decoration:line-through;color:var(--muted)}
.tick{width:28px;height:28px;flex:0 0 auto;border-radius:8px;border:1.5px solid var(--ink);background:transparent;font-weight:700;line-height:1;padding:0}
.tick[aria-pressed=true]{background:var(--good);border-color:var(--good);color:var(--surface)}
.note .btn{margin-top:8px}
/* mixer: stacked rows you slide through. Tops and bottoms share one backdrop and one scale so they line up. */
.mix{--tw:min(56vw,240px,27vh);display:flex;flex-direction:column;gap:8px}
.mrow{position:relative}
.mchip{position:absolute;left:8px;top:8px;z-index:2;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
.mstrip{position:relative;display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 calc(50% - var(--tw)/2);scrollbar-width:none;overscroll-behavior-x:contain}
.mstrip::-webkit-scrollbar{display:none}
.mtile{flex:0 0 var(--tw);height:calc(var(--tw)*var(--r,1));scroll-snap-align:center;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--sunk);opacity:.35;transform:scale(.9);transition:opacity .18s,transform .18s}
.mtile img{width:100%;height:100%;object-fit:cover;display:block}
.mtile.on{opacity:1;transform:none;border-color:var(--ink)}
.mrow.stage .mstrip{background:var(--studio);gap:0}
.mrow.stage .mtile{border:0;border-radius:0;background:var(--studio)}
.mrow.stage.s-first .mstrip{border-radius:16px 16px 0 0}
.mrow.stage.s-last .mstrip{border-radius:0 0 16px 16px}
.mrow.stage.s-first.s-last .mstrip{border-radius:16px}
.mrow.stage.s-first:not(.s-last){margin-bottom:-8px}
.marrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;padding:0}
.marrow.l{left:6px}.marrow.r{right:6px}
.mnames{margin:0;font-size:14px}
@media (prefers-reduced-motion:reduce){.mtile{transition:none}}
img.cut{object-fit:contain!important;background:var(--studio)}
.cutprev{margin:0;display:flex;gap:12px;align-items:center}
.cutprev img{width:96px;height:124px;border-radius:10px;border:1px solid var(--line);flex:0 0 auto}
.cutprev figcaption{min-width:0}
.note.warn{border-style:solid;border-color:var(--warn);background:var(--warn-soft);color:var(--ink)}

/* swing-tag garment cards */
.rail{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tag{position:relative;display:flex;flex-direction:column;text-align:left;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.tag img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--sunk)}
.tag .punch{position:absolute;top:8px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.tag .info{padding:10px 10px 12px;display:flex;flex-direction:column;gap:5px;border-top:1px dashed var(--line);min-width:0}
.tag .name{font-weight:600;font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.dots{display:flex;gap:4px;align-items:center}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--line);flex:0 0 auto}
.flag{position:absolute;top:8px;right:8px;background:var(--mark);color:#171C36;font:500 10px var(--mono);letter-spacing:.06em;padding:3px 6px;border-radius:4px}

.empty{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 18px;display:flex;flex-direction:column;gap:14px}
.empty h3{font-size:20px}
.empty ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}

/* question blocks */
.q{display:flex;flex-direction:column;gap:8px}
.q>label,.q>.lab{font-weight:600}
.must{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.must img{width:40px;height:52px;object-fit:cover;border-radius:6px}
.must span{flex:1;min-width:0;overflow-wrap:anywhere}

/* outfit cards */
.look{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.look h3{font-size:19px}
.mock{display:flex;gap:10px;align-items:stretch}
.mock .stage{flex:0 0 34%;max-width:150px;background:var(--sunk);border-radius:10px;display:flex;align-items:center;justify-content:center;padding:8px}
.fig{width:100%;height:auto;display:block}
.pieces{flex:1;min-width:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;align-content:start}
.piece{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);padding:0;background:var(--sunk)}
.piece img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.piece span{position:absolute;left:0;right:0;bottom:0;background:var(--shade);color:#fff;font:500 9px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 4px}
.check{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.pill{font-weight:600;border-radius:999px;padding:3px 10px;font-size:12px}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.look p{margin:0}
.look dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px}
.look dt{padding-top:2px}
.look dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* bottom bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding-block:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.tabs .row{display:flex;max-width:720px;margin:0 auto}
.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;padding:8px 2px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs a[aria-current=page]{color:var(--accent)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--shade);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding-block:14px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.panel .head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.panel .hero{width:100%;max-height:44vh;object-fit:contain;background:var(--sunk);border-radius:12px}
.fb figure{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.fb .hero{max-height:34vh}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.colrow{display:flex;gap:8px;align-items:center}
.colrow input[type=color]{width:48px;height:44px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--surface);flex:0 0 auto}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);text-align:center}
.spin{width:16px;height:16px;border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite;flex:0 0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<header class="top gut">
  <div class="row">
    <div class="brand">Closet <i>Index</i></div>
    <div class="mono" id="count">—</div>
  </div>
</header>

<main class="gut">
  <!-- WARDROBE -->
  <section class="view" id="v-wardrobe">
    <div class="bar">
      <input class="grow" type="search" id="search" placeholder="Search your clothes" aria-label="Search your clothes">
      <button class="btn primary" data-act="add">Add photos</button>
    </div>
    <div class="chips scroll" id="cats" role="group" aria-label="Filter by type"></div>
    <div id="progress" aria-live="polite"></div>
    <div id="storeNote"></div>
    <div id="rail"></div>
    <input type="file" id="file" accept="image/*" multiple hidden>
  </section>

  <!-- MIX -->
  <section class="view" id="v-mix" hidden>
    <div class="bar"><div class="chips grow" id="mixMode"></div><button class="btn small" data-act="mixshuffle">Shuffle</button></div>
    <div id="mixRows" class="mix"></div>
    <div id="mixFoot" class="view"></div>
    <div id="mixTips" class="view"></div>
  </section>

  <!-- STYLE ME -->
  <section class="view" id="v-style" hidden>
    <h2>What are you dressing for?</h2>
    <p class="lede">Answer a few questions and get three outfits built only from clothes you own.</p>
    <div id="trends"></div>
    <div id="tasteNote"></div>
    <div id="questions" class="view"></div>
    <div class="q" id="mustWrap" hidden>
      <div class="lab">Must include</div>
      <div class="must" id="must"></div>
    </div>
    <div class="q">
      <label for="extra">Anything else?</label>
      <textarea id="extra" placeholder="e.g. lots of walking, meeting my partner's parents, no heels"></textarea>
    </div>
    <div class="bar">
      <button class="btn primary grow" id="go" data-act="suggest">Suggest outfits</button>
      <button class="btn" id="stop" data-act="stop" hidden>Stop</button>
    </div>
    <div id="styleStatus" aria-live="polite"></div>
    <div id="results" class="view"></div>
  </section>

  <!-- SAVED -->
  <section class="view" id="v-saved" hidden>
    <h2>Saved looks</h2>
    <div id="saved" class="view"></div>
  </section>

  <!-- PLAN + WEAR LOG -->
  <section class="view" id="v-plan" hidden>
    <h2>Your week</h2>
    <p class="lede" id="planLede"></p>
    <div id="week" class="view"></div>
    <div class="bar">
      <button class="btn primary grow" id="planGo" data-act="planweek">Fill my empty days</button>
      <button class="btn" id="planStop" data-act="stop" hidden>Stop</button>
    </div>
    <div id="planStatus" aria-live="polite"></div>
    <h2>Wear log</h2>
    <div id="wearlog" class="view"></div>
  </section>

  <!-- SHOPPING LIST -->
  <section class="view" id="v-shop" hidden>
    <h2>Shopping list</h2>
    <p class="lede">Pieces that would open up the most new outfits with what you already own.</p>
    <form class="bar" id="shopForm">
      <input class="grow" type="text" id="shopText" maxlength="80" placeholder="Add a piece, e.g. white sneakers" aria-label="Add a piece to your shopping list">
      <button class="btn" type="submit">Add</button>
    </form>
    <div id="shoplist" class="view"></div>
    <div class="bar"><button class="btn primary grow" id="shopGo" data-act="shopideas">Suggest what to buy next</button></div>
    <div id="shopStatus" aria-live="polite"></div>
    <div id="shopideas" class="view"></div>
  </section>
</main>

<nav class="tabs gut" aria-label="Sections">
  <div class="row">
    <a href="#wardrobe" data-tab="wardrobe"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a2 2 0 1 0-2-2M12 8v2l9 6.5a1 1 0 0 1-.6 1.8H3.6a1 1 0 0 1-.6-1.8L12 10"/></svg>Wardrobe</a>
    <a href="#mix" data-tab="mix"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="5" rx="1.5"/><rect x="5" y="9.5" width="14" height="5" rx="1.5"/><rect x="5" y="16" width="14" height="5" rx="1.5"/></svg>Mix</a>
    <a href="#style" data-tab="style"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.7 2.3L22 19l-2.3.7L19 22l-.7-2.3L16 19l2.3-.7z"/></svg>Style me</a>
    <a href="#plan" data-tab="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M8 3v5M16 3v5"/></svg>Plan</a>
    <a href="#saved" data-tab="saved"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4z"/></svg>Saved</a>
    <a href="#shop" data-tab="shop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 13H6zM9 8V6a3 3 0 0 1 6 0v2"/></svg>Shop</a>
  </div>
</nav>

<div class="sheet" id="sheet" hidden><div class="panel gut" id="panel" role="dialog" aria-modal="true" aria-label="Item details"></div></div>
<input type="file" id="fileBack" accept="image/*" hidden>
<input type="file" id="fileReplace" accept="image/*" hidden>
<div class="toast" id="toast" hidden role="status"></div>

<script src="config.js"></script>
<script src="trends-default.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="backend.js"></script>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};

/* ---------- colour ---------- */
function hsl(hex){
  hex=safeHex(hex);var r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  var mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,h=0,s=0,d=mx-mn;
  if(d){s=l>.5?d/(2-mx-mn):d/(mx+mn);
    h=mx===r?((g-b)/d+(g<b?6:0)):mx===g?((b-r)/d+2):((r-g)/d+4);h*=60}
  return {h:h,s:s,l:l};
}
function isNeutral(c){
  return c.s<.16||c.l<.13||c.l>.92||(c.h>=195&&c.h<=255&&(c.l<.3||c.s<.45))||(c.h>=18&&c.h<=50&&c.s<.5&&c.l>.2);
}
function hueGap(a,b){var d=Math.abs(a-b)%360;return d>180?360-d:d}
function mainHex(it){return safeHex(it&&it.colors&&it.colors[0]&&it.colors[0].hex)}
function harmony(items){
  var core=items.filter(function(i){return i.category!=="accessory"&&i.category!=="bag"});
  if(!core.length)core=items;
  var groups=[];
  core.forEach(function(i){var c=hsl(mainHex(i));if(isNeutral(c))return;
    var g=groups.find(function(g){return hueGap(g.h,c.h)<=25});if(g)g.n++;else groups.push({h:c.h,n:1})});
  var out;
  if(!groups.length)out={level:"good",label:"Neutrals only: clean and easy"};
  else if(groups.length===1)out=groups[0].n>1?{level:"good",label:"Tonal: shades of one colour family"}:{level:"good",label:"Neutral base with one accent"};
  else if(groups.length===2){var d=hueGap(groups[0].h,groups[1].h);
    out=d<=60?{level:"good",label:"Neighbouring colours that blend"}:
        d>=150?{level:"ok",label:"Opposite colours: a deliberate contrast"}:
        {level:"ok",label:"Two accents: let one lead"}}
  else out={level:"warn",label:"Three competing colours: swap one for a neutral"};
  var pats=core.filter(function(i){return i.pattern&&i.pattern!=="solid"}).length;
  if(pats>=2){out={level:out.level==="good"?"ok":"warn",label:out.label+". Two patterns, so keep one quiet"}}
  return out;
}

/* ---------- photos ---------- */
async function decode(file){
  try{return await createImageBitmap(file,{imageOrientation:"from-image"})}catch(e){}
  return await new Promise(function(res,rej){var u=URL.createObjectURL(file),im=new Image();
    im.onload=function(){URL.revokeObjectURL(u);res(im)};im.onerror=function(){URL.revokeObjectURL(u);rej(new Error("decode"))};im.src=u});
}
function scaled(src,max){
  var w=src.width,h=src.height,k=Math.min(1,max/Math.max(w,h));
  var c=document.createElement("canvas");c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
  c.getContext("2d").drawImage(src,0,0,c.width,c.height);return c;
}
function guessColour(canvas){
  try{var n=24,c=document.createElement("canvas");c.width=n;c.height=n;var x=c.getContext("2d");
    x.drawImage(canvas,canvas.width*.25,canvas.height*.25,canvas.width*.5,canvas.height*.5,0,0,n,n);
    var d=x.getImageData(0,0,n,n).data,b={},best=null;
    for(var i=0;i<d.length;i+=4){var k=(d[i]>>5)+"-"+(d[i+1]>>5)+"-"+(d[i+2]>>5);
      var e=b[k]||(b[k]={n:0,r:0,g:0,b:0});e.n++;e.r+=d[i];e.g+=d[i+1];e.b+=d[i+2];if(!best||e.n>best.n)best=e}
    var hx=function(v){return ("0"+Math.round(v/best.n).toString(16)).slice(-2)};
    return "#"+hx(best.r)+hx(best.g)+hx(best.b);
  }catch(e){return "#8a8f9c"}
}
async function prep(file){
  var src=await decode(file);

  var blob=await new Promise(function(res){big.toBlob(res,"image/jpeg",.82)});
  if(!blob)throw new Error("encode");
  return {thumb:small.toDataURL("image/jpeg",.7),blob:blob,guess:guessColour(small)};
}
/* ---------- clean cut-outs: upright, background removed, placed on one standard backdrop ---------- */
var CUT_CATS={top:1,bottom:1,dress:1,outerwear:1},CUT_W=480,CUT_H={top:416,outerwear:416,bottom:624,dress:720},cutOn=true;

  c.width=side?h:w;c.height=side?w:h;
  var x=c.getContext("2d");x.translate(c.width/2,c.height/2);x.rotate(deg*Math.PI/180);x.drawImage(src,-w/2,-h/2);return c;
}
function tilted(src,rad){
  var w=src.width,h=src.height,c=Math.abs(Math.cos(rad)),s=Math.abs(Math.sin(rad)),cv=document.createElement("canvas");
  cv.width=Math.ceil(w*c+h*s);cv.height=Math.ceil(w*s+h*c);
  var x=cv.getContext("2d");x.translate(cv.width/2,cv.height/2);x.rotate(rad);x.drawImage(src,-w/2,-h/2);return cv;
}
async function blobCanvas(blob,max){return scaled(await decode(blob),max||1200)}
/* Measures the cut-out from its transparency: drops stray blobs, then returns its box, how much of the photo it covers,
   how much of it touches the photo's edge, and how far its long axis leans from vertical. */
function cutShape(cv){
  var W=cv.width,H=cv.height,x=cv.getContext("2d"),im=x.getImageData(0,0,W,H),d=im.data;
  var g=Math.max(1,Math.round(Math.max(W,H)/160)),gw=Math.ceil(W/g),gh=Math.ceil(H/g),m=new Uint8Array(gw*gh),gx,gy,i,k,l;
  for(gy=0;gy<gh;gy++)for(gx=0;gx<gw;gx++){
    var px=Math.min(W-1,gx*g+(g>>1)),py=Math.min(H-1,gy*g+(g>>1));if(d[(py*W+px)*4+3]>110)m[gy*gw+gx]=1}
  var lab=new Int32Array(gw*gh),sizes=[0],n=0,stack=[];
  for(i=0;i<m.length;i++){
    if(!m[i]||lab[i])continue;n++;var sz=0;stack.push(i);lab[i]=n;
    while(stack.length){var p=stack.pop();sz++;var qy=(p/gw)|0,qx=p-qy*gw;
      if(qx>0&&m[p-1]&&!lab[p-1]){lab[p-1]=n;stack.push(p-1)}
      if(qx<gw-1&&m[p+1]&&!lab[p+1]){lab[p+1]=n;stack.push(p+1)}
      if(qy>0&&m[p-gw]&&!lab[p-gw]){lab[p-gw]=n;stack.push(p-gw)}
      if(qy<gh-1&&m[p+gw]&&!lab[p+gw]){lab[p+gw]=n;stack.push(p+gw)}}

      for(var xx=0;xx<W;xx++){var a=(y*W+xx)*4+3;if(d[a]){l=lab[row+Math.min(gw-1,(xx/g)|0)];if(l&&!keep[l])d[a]=0}}}
    x.putImageData(im,0,0)}

  for(gy=0;gy<gh;gy++)for(gx=0;gx<gw;gx++){l=lab[gy*gw+gx];if(!l||!keep[l])continue;

function bottomLen(it){var t=itemText(it);return /short/i.test(t)?.5:/mini/i.test(t)?.45:/skirt|capri|cropped|culotte/i.test(t)?.72:1}
/* Every cut-out of a type is drawn at the same scale on the same canvas: tops sit on the bottom edge and bottoms hang
   from the top edge, both centred, so a top stacked above a pair of trousers lines up like an outfit. */
function composeCut(cv,box,it){
  var cat=it.category,CH=CUT_H[cat]||416,out=document.createElement("canvas");out.width=CUT_W;out.height=CH;
  var x=out.getContext("2d");x.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--studio").trim()||"#ECEEF3";x.fillRect(0,0,CUT_W,CH);
  var k=Math.min(CH*.96*(cat==="bottom"?bottomLen(it):1)/box.h,CUT_W*.94/box.w),dw=box.w*k,dh=box.h*k;
  var dy=cat==="top"||cat==="outerwear"?CH*.99-dh:CH*.01;
  x.imageSmoothingQuality="high";x.drawImage(cv,box.x,box.y,box.w,box.h,(CUT_W-dw)/2,dy,dw,dh);
  return out.toDataURL("image/jpeg",.84);

/* src is an upright canvas of the photo. Returns the fields to merge into the item, or null when no cut-out could be tried. */
async function makeCut(src,it){
  if(!canCut()||!CUT_CATS[it.category])return null;
  var got;
  try{got=await ai.cutout(await toBlob(scaled(src,1024),.88))}
  catch(e){if(e&&e.code==="cutout_off")cutOn=false;return null}
  var bmp=await decode(got.blob),cv=document.createElement("canvas");cv.width=bmp.width;cv.height=bmp.height;cv.getContext("2d").drawImage(bmp,0,0);
  var first=cutShape(cv),sh=first;

  if(it.category==="bottom"&&first.elong>1.5&&Math.abs(first.tilt)>.07){cv=tilted(cv,-first.tilt);sh=cutShape(cv)||first}
  var why=first.edge>.03?"Part of the item is outside the photo.":first.cover>.8?"The item fills the whole photo, so its outline is unclear.":
    got.doubt>.5?"Its outline was hard to find against this background.":"";

/* One number per photo: how far to turn it clockwise so the item is upright. */
async function askTurn(blobs){
  var none=blobs.map(function(){return 0});
  if(!ai||!canSee||!blobs.length)return none;
  try{
    var n=blobs.length,r=await ai.json("There "+(n===1?"is 1 photo":"are "+n+" photos, in order")+". Each shows one clothing item or pair of shoes. "+
      "For each photo, how many degrees CLOCKWISE must it be turned so the item is upright as worn, with the neckline or waistband at the top (shoes resting on their soles)? "+
      "Use 0 when it is already upright or only slightly tilted. Reply with only a JSON array of "+n+" number"+(n===1?"":"s")+", each 0, 90, 180 or 270.",{images:blobs});
    if(typeof r==="number")r=[r];

  }catch(e){return none}
}

}

  '"colors": up to 3 of {"name": plain colour word, "hex": "#rrggbb"}, the dominant colour of the item first; colours of the item only, never the background, '+
  '"pattern": one of "solid","striped","checked","floral","graphic","other", "material": best guess or "", '+
  '"formality": integer 1-5 (1 gym wear, 2 casual, 3 smart casual, 4 business or cocktail, 5 black tie), '+
  '"warmth": integer 1-5 (1 for very hot weather, 5 for deep winter), "tags": up to 4 short style words, '+
  '"layer": for tops and outerwear only, "base" (worn next to the skin: t-shirt, shirt, tank, polo), "mid" (worn over a base: hoodie, sweatshirt, sweater, cardigan, overshirt, gilet) or "outer" (jacket, blazer, coat); "" for everything else. Hoodies, sweatshirts and sweaters are category "top" with layer "mid", not outerwear, '+

async function addPhotos(files){

  try{
    say("Preparing "+n+(n===1?" photo":" photos")+"…");
    var preps=[];
    for(var i=0;i<files.length;i++){try{preps.push(await prep(files[i]))}catch(e){skipped++}}
    var queue=preps.slice();
    while(queue.length){
      var chunk=queue.splice(0,maxImg),tags=null;
      if(ai&&canSee){

        try{var res=await ai.json(tagPrompt(chunk.length),{images:chunk.map(function(p){return p.blob})});
          if(res&&!Array.isArray(res)&&chunk.length===1)res=[res];
          if(Array.isArray(res))tags=res;
        }catch(e){
          if(["not_granted","sampling_disabled","images_unavailable","not_declared","capability_disabled","capability_removed"].indexOf(e&&e.code)>=0){canSee=false}
          else if(e&&e.code==="rate_limited"){toast("Claude is busy right now. Photos added without tags.")}
          else if(e&&e.code==="refused"){toast("Claude couldn't describe a photo. Added without tags.")}
        }
      }

      var used={},backFor={},isBack={};
      if(tags)tags.forEach(function(t,j){
        if(!t||t.category==="none"||used[j])return;
        var k=Math.round(Number(t.sameAs))-1;
        if(!(k>=0&&k<chunk.length)||k===j||used[k]||!tags[k]||tags[k].category==="none")return;
        var b=t.view==="back"?j:tags[k].view==="back"?k:Math.max(j,k),f=b===j?k:j;
        used[j]=used[k]=1;backFor[f]=b;isBack[b]=1;

      var last=chunk.length-1;
      if(tags&&queue.length&&chunk.length>1&&!used[last]&&!chunk[last].deferred){chunk[last].deferred=true;queue.unshift(chunk[last]);chunk.pop()}
      for(var u=0;u<chunk.length;u++){
        var turn=rotDeg(tags&&tags[u]&&tags[u].rotate);
        if(turn){try{var up0=turned(await blobCanvas(chunk[u].blob),turn);chunk[u].blob=await toBlob(up0);chunk[u].thumb=scaled(up0,360).toDataURL("image/jpeg",.7)}catch(e){}}
      }
      for(var j=0;j<chunk.length;j++){
        if(isBack[j])continue;
        var t=tags?tags[j]:null;
        if(t&&t.category==="none"){skipped++;continue}
        var it=makeItem(chunk[j],t);
        if(canCut()&&CUT_CATS[it.category]){
          say("Cleaning up photo "+(added.length+1)+"…");
          try{var cf=await makeCut(await blobCanvas(chunk[j].blob),it);if(cf)Object.assign(it,cf)}catch(e){}
        }
        say("Saving "+(added.length+1)+"…");
        if(assets){try{var up=await assets.upload(chunk[j].blob,{type:"image/jpeg"});if(up&&up.id)it.asset=up.id}catch(e){}}
        if(backFor[j]!=null){
          var bp=chunk[backFor[j]],bt=tags[backFor[j]];
          it.backThumb=bp.thumb;it.backNote=String((bt&&bt.backNote)||(t&&t.backNote)||"").slice(0,80);paired++;
          if(assets){try{var ub=await assets.upload(bp.blob,{type:"image/jpeg"});if(ub&&ub.id)it.backAsset=ub.id}catch(e){}}
        }
        await put(it);added.push(it);
      }
    }
  }finally{S.busy=false;$("progress").innerHTML=""}
  var untagged=added.filter(function(a){return a.review}).length;
  if(!added.length)toast(skipped?"Those photos couldn't be read as clothing.":"Nothing was added.");
  else if(untagged)toast("Added "+added.length+". Tap each one to set its type and colour.");
  else{var hard=added.filter(function(a){return a.cutState==="poor"}).length;
    toast("Added "+added.length+(added.length===1?" piece":" pieces")+(paired?" ("+paired+" with front and back)":"")+(skipped?", skipped "+skipped:"")+"."+
      (hard?" "+hard+(hard===1?" photo was":" photos were")+" hard to cut out; a better photo would help.":""))}
  if(added.length===1&&added[0].review)openItem(added[0].id);
}

function keyOf(ids){return ids.slice().sort().join("+")}
function localOutfits(){
  var all=availItems(),pick=function(c){return all.filter(function(i){return i.category===c})};
  var F=F_TARGET[S.answers.occasion]||2.5,W=W_TARGET[S.answers.weather]||2.5,must=S.must&&S.items.get(S.must);
  var fit=function(set){var h=harmony(set),d=0;set.forEach(function(i){d+=Math.abs((i.formality||3)-F)+Math.abs((i.warmth||2)-W)});
    return (h.level==="good"?4:h.level==="ok"?2:0)-d/set.length};
  var combos=[];
  pick("top").forEach(function(t){pick("bottom").forEach(function(b){combos.push([t,b])})});
  pick("dress").forEach(function(d){combos.push([d])});
  if(must&&["top","bottom","dress"].indexOf(must.category)>=0)combos=combos.filter(function(c){return c.indexOf(must)>=0});
  combos=combos.filter(function(c){return S.seen.indexOf(keyOf(c.map(function(i){return i.id})))<0||combos.length<=3});
  return combos.map(function(c){return {c:c,s:fit(c)+Math.random()*.8}}).sort(function(a,b){return b.s-a.s}).slice(0,3).map(function(x,n){
    var set=x.c.slice();

function bestShoes(ids){
  var set=ids.map(function(id){return S.items.get(id)}).filter(Boolean);
  var opts=availItems().filter(function(i){return i.category==="shoes"});
  if(!opts.length||!set.length)return null;
  var F=set.reduce(function(a,i){return a+(i.formality||3)},0)/set.length,best=null,bs=-1e9;
  opts.forEach(function(o){var h=harmony(set.concat(o)),s=(h.level==="good"?4:h.level==="ok"?2:0)-Math.abs((o.formality||3)-F);
    if(s>bs){bs=s;best=o}});
  return best.id;
}
function clean(raw,max){
  var list=raw&&Array.isArray(raw.outfits)?raw.outfits:Array.isArray(raw)?raw:[];
  var seen={},out=[];
  list.forEach(function(o){if(!o||!Array.isArray(o.itemIds))return;
    var ids=o.itemIds.map(String).filter(function(id,i,a){return S.items.has(id)&&!S.items.get(id).wash&&a.indexOf(id)===i});
    var cats=ids.map(function(id){return S.items.get(id).category});
    if(!(cats.indexOf("dress")>=0||(cats.indexOf("top")>=0&&cats.indexOf("bottom")>=0)))return;
    if(cats.indexOf("shoes")<0){var sh=bestShoes(ids);if(sh)ids.push(sh)}
    var k=keyOf(ids);if(seen[k])return;seen[k]=1;
    var t=function(v,n){return String(v||"").slice(0,n)};
    out.push({title:t(o.title,50)||"Outfit",itemIds:ids,why:t(o.why,320),colors:t(o.colors,220),trendNote:t(o.trendNote,220),tip:t(o.tip,220),
      level:["Conservative","In between","Fashion statement"].indexOf(o.level)>=0?o.level:"",layering:t(o.layering,320),
      layers:Array.isArray(o.layers)?o.layers.map(String).filter(function(id){return ids.indexOf(id)>=0}):[],
      moves:Array.isArray(o.moves)?o.moves.slice(0,3).map(function(m){return t(m,140)}).filter(Boolean):[]});
  });
  return out.slice(0,max||3);
}

    pending=null;closeSheet()}
  else if(act==="viewplan"){var vp=S.plans.get("p"+b.dataset.date);if(vp&&vp.look)openLook(vp.look,dayLabel(vp.date))}
  else if(act==="woreplan"){var wp=S.plans.get("p"+b.dataset.date);if(wp&&wp.look)logWear(wp.look.itemIds||[],wp.look.title,wp.date)}
  else if(act==="clearplan"){var cp=S.plans.get("p"+b.dataset.date);if(cp)drop(cp)}
  else if(act==="planweek")planWeek();
  else if(act==="rateup"||act==="ratedown"){var lr=LOOKS[b.dataset.ref];
    if(lr){lr.rated=act==="rateup"?"up":"down";rate(lr,act==="rateup");toast(act==="rateup"?"Got it. More like this.":"Got it. Less like this.")}}
  else if(act==="resettaste"){var t0=S.tastes.get("taste");if(t0)drop(t0);toast("Taste notes cleared.")}
  else if(act==="togglewash"){var tw=readSheet();
    if(tw){tw.wash=!tw.wash;if(tw.wash&&S.must===tw.id)S.must=null;put(tw);closeSheet();toast(tw.wash?"In the wash. It won't be suggested until it's back.":"Back in your closet.")}}
  else if(act==="washall"){Array.from(S.items.values()).filter(function(i){return i.wash}).forEach(function(i){put(Object.assign({},i,{wash:false}))});toast("Everything is back from the wash.")}
  else if(act==="woreitem"){var wi=readSheet();if(wi){put(wi);logWear([wi.id],wi.name);closeSheet()}}
  else if(act==="delwear"){var dw=S.wears.get(b.dataset.id);if(dw)drop(dw)}
  else if(act==="addgap"){addShop(S.gap,"Suggested while styling");S.gap="";renderStyle()}
  else if(act==="shopdone"){var sd=S.shop.get(b.dataset.id);if(sd)put(Object.assign({},sd,{done:!sd.done}))}
  else if(act==="shopdel"){var sx=S.shop.get(b.dataset.id);if(sx)drop(sx)}
  else if(act==="shopideas")shopIdeas();
  else if(act==="addidea"){var pick=S.ideas[Number(b.dataset.i)];if(pick){S.ideas.splice(Number(b.dataset.i),1);addShop(pick.piece,pick.why)}}
  else if(act==="mixpick")setMix(b.dataset.cat,b.dataset.id,"smooth");
  else if(act==="mixprev")mixStep(b.dataset.cat,-1);
  else if(act==="mixnext")mixStep(b.dataset.cat,1);
  else if(act==="mixmode"){S.mix.mode=b.dataset.v;renderMix()}
  else if(act==="mixouter"){S.mix.outer=!S.mix.outer;renderMix()}
  else if(act==="mixshuffle"){mixRows().forEach(function(c){var l=mixItems(c);if(l.length)setMix(c,l[Math.floor(Math.random()*l.length)].id,"smooth")})}
  else if(act==="mixsave"){var mo=mixLook();if(mo){put(Object.assign(lookData(mo),{kind:"outfit",id:rid("o"),occasion:"My mix",saved:Date.now(),swap:mo.swap||""}));toast("Saved to your looks.")}}
  else if(act==="mixtips")mixTips();
  else if(act==="rotate"){var ri=readSheet();if(ri){put(ri);photoJob(ri.id,"Rotating…",async function(it){await setPhoto(it,turned(await fullCanvas(it),90))})}}
  else if(act==="recut"){var ci=readSheet();if(ci){put(ci);photoJob(ci.id,"Cutting out…",async function(it){
    var c=await makeCut(await fullCanvas(it),it);if(!c){toast(cutOn?"The cut-out service didn't respond. Try again.":"Clean cut-outs aren't switched on yet.");return}
    await put(Object.assign({},S.items.get(it.id)||it,c))})}}
  else if(act==="replacephoto"){var pi=readSheet();if(pi){put(pi);replaceTarget=pi.id;$("fileReplace").click()}}
  else if(act==="tidy")tidyAll();
  else if(act==="tidystop"){S.tidyStop=true;b.disabled=true;b.textContent="Stopping…"}
  else if(act==="refreshtrends")refreshTrends();
  else if(act==="delitem"){
    if(Date.now()-armed>4000){armed=Date.now();b.textContent="Tap again to delete for good";return}
    var it=S.items.get(openId);if(!it)return;closeSheet();if(S.must===it.id)S.must=null;
    drop(it);if(assets&&it.asset)assets.delete(it.asset).catch(function(){});
    if(assets&&it.backAsset)assets.delete(it.backAsset).catch(function(){});toast("Removed from your closet.")}
});
boot();
})();
</script>
